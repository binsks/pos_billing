
{% extends "base.html" %}

{% block title %}Add Purchase{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h2 class="fw-bold mb-1">
            <i class="bi bi-box-arrow-in-down me-2"></i>
            Add Purchase
        </h2>

        <p class="text-muted mb-0">
            Record stock received from a supplier
        </p>

    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="row g-4">

            <!-- Purchase Details -->

            <div class="col-lg-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-header bg-white py-3">

                        <h5 class="mb-0 fw-bold">
                            Purchase Details
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Supplier
                            </label>

                            <select
                                name="supplier"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Supplier
                                </option>

                                {% for supplier in suppliers %}

                                <option value="{{ supplier.id }}">
                                    {{ supplier.name }}
                                    {% if supplier.company %}
                                        - {{ supplier.company }}
                                    {% endif %}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Supplier Invoice Number
                            </label>

                            <input
                                type="text"
                                name="invoice_number"
                                class="form-control"
                                placeholder="e.g. SUP-INV-1001"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Notes
                            </label>

                            <textarea
                                name="notes"
                                class="form-control"
                                rows="4"
                                placeholder="Optional notes..."
                            ></textarea>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Products -->

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-header bg-white py-3
                                d-flex justify-content-between
                                align-items-center">

                        <h5 class="mb-0 fw-bold">
                            Products
                        </h5>

                        <button
                            type="button"
                            id="addProductBtn"
                            class="btn btn-sm btn-dark"
                        >
                            <i class="bi bi-plus-lg me-1"></i>
                            Add Product
                        </button>

                    </div>


                    <div class="card-body">

                        <div id="purchaseItems"></div>


                        <div
                            id="emptyPurchase"
                            class="text-center py-5 text-muted"
                        >

                            <i class="bi bi-box-seam display-5"></i>

                            <p class="mt-3 mb-0">
                                Click "Add Product" to add items.
                            </p>

                        </div>


                        <hr class="my-4">


                        <div class="d-flex justify-content-end">

                            <div style="min-width:280px;">

                                <div class="d-flex justify-content-between">

                                    <span>
                                        Subtotal
                                    </span>

                                    <strong>
                                        ₹<span id="grandTotal">
                                            0.00
                                        </span>
                                    </strong>

                                </div>

                            </div>

                        </div>


                        <div class="d-flex justify-content-end gap-2 mt-4">

                            <a
                                href="{% url 'purchase_list' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="bi bi-check-lg me-1"></i>
                                Save Purchase
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </form>

</div>


<script>

const products = [

    {% for product in products %}

    {
        id: "{{ product.id }}",
        name: "{{ product.name|escapejs }}",
        code: "{{ product.code|escapejs }}"
    },

    {% endfor %}

];


const purchaseItems =
    document.getElementById("purchaseItems");

const emptyPurchase =
    document.getElementById("emptyPurchase");

const addProductBtn =
    document.getElementById("addProductBtn");


addProductBtn.addEventListener(
    "click",
    addProduct
);


function addProduct() {

    emptyPurchase.style.display = "none";

    const row = document.createElement("div");

    row.className =
        "purchase-row border rounded p-3 mb-3";


    let options = `
        <option value="">
            Select Product
        </option>
    `;


    products.forEach(product => {

        options += `
            <option value="${product.id}">
                ${product.name} (${product.code})
            </option>
        `;

    });


    row.innerHTML = `

        <div class="row g-2 align-items-end">

            <div class="col-md-5">

                <label class="form-label small fw-semibold">
                    Product
                </label>

                <select
                    name="product_id"
                    class="form-select product-select"
                    required
                >
                    ${options}
                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label small fw-semibold">
                    Quantity
                </label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control quantity"
                    min="1"
                    value="1"
                    required
                >

            </div>


            <div class="col-md-3">

                <label class="form-label small fw-semibold">
                    Purchase Price
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        ₹
                    </span>

                    <input
                        type="number"
                        name="purchase_price"
                        class="form-control price"
                        min="0"
                        step="0.01"
                        value="0"
                        required
                    >

                </div>

            </div>


            <div class="col-md-2">

                <button
                    type="button"
                    class="btn btn-outline-danger w-100 remove-row"
                >
                    <i class="bi bi-trash"></i>
                </button>

            </div>

        </div>

    `;


    purchaseItems.appendChild(row);

    calculateTotal();

    row.querySelector(".quantity")
        .addEventListener(
            "input",
            calculateTotal
        );

    row.querySelector(".price")
        .addEventListener(
            "input",
            calculateTotal
        );


    row.querySelector(".remove-row")
        .addEventListener(
            "click",
            function () {

                row.remove();

                calculateTotal();

                if (
                    purchaseItems.children.length === 0
                ) {
                    emptyPurchase.style.display = "block";
                }

            }
        );

}


function calculateTotal() {

    let total = 0;

    document
        .querySelectorAll(".purchase-row")
        .forEach(row => {

            const quantity =
                parseFloat(
                    row.querySelector(".quantity").value
                ) || 0;

            const price =
                parseFloat(
                    row.querySelector(".price").value
                ) || 0;

            total += quantity * price;

        });


    document.getElementById("grandTotal")
        .textContent = total.toFixed(2);

}

</script>

{% endblock %}
