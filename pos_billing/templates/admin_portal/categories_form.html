
{% extends "base.html" %}

{% block title %}Add Category | POS Billing{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <a href="{% url 'category_list' %}"
               class="text-decoration-none">

                <i class="bi bi-arrow-left"></i>
                Back to Categories

            </a>

            <div class="card border-0 shadow-sm rounded-4 mt-3">

                <div class="card-body p-4 p-lg-5">

                    <div class="mb-4">

                        <div class="category-icon mb-3">
                            <i class="bi bi-tag"></i>
                        </div>

                        <h3 class="fw-bold">
                            Add Category
                        </h3>

                        <p class="text-muted">
                            Create a category for your products.
                        </p>

                    </div>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Category Name *
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Example: Men's Wear"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Category description..."
                            ></textarea>

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="{% url 'category_list' %}"
                                class="btn btn-light border"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="bi bi-check-lg"></i>
                                Save Category
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
