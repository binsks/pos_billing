
{% extends "base.html" %}

{% block title %}Add Customer | POS Billing{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <a href="{% url 'customer_list' %}"
               class="text-decoration-none">

                <i class="bi bi-arrow-left"></i>
                Back to Customers

            </a>


            <div class="card border-0 shadow-sm rounded-4 mt-3">

                <div class="card-body p-4 p-lg-5">

                    <div class="customer-icon mb-3">
                        <i class="bi bi-person-plus"></i>
                    </div>

                    <h3 class="fw-bold">
                        Add Customer
                    </h3>

                    <p class="text-muted mb-4">
                        Add customer information for billing.
                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name *
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Customer full name"
                                required
                            >

                        </div>


                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone *
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="+91 9876543210"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="customer@example.com"
                                >

                            </div>


                            <div class="col-12">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea
                                    name="address"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Customer address"
                                ></textarea>

                            </div>

                        </div>


                        <div class="d-flex gap-2 mt-4">

                            <a
                                href="{% url 'customer_list' %}"
                                class="btn btn-light border"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="bi bi-check-lg"></i>
                                Save Customer
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
